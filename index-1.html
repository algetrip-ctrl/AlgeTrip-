<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#f1f6f2;--s:rgba(255,255,255,.78);--bd:rgba(10,45,28,.1);--tx:#0b1f15;--mu:#58705f;--ac:#0a8f52;--on:#fff;--r:#d52b1e;--in:rgba(10,45,28,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#06110c;--s:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#f0faf4;--mu:#8fb09e;--ac:#36f2a2;--on:#04150c;--r:#ff6a5a;--in:rgba(255,255,255,.07)}}
:root[data-theme=dark]{--bg:#06110c;--s:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#f0faf4;--mu:#8fb09e;--ac:#36f2a2;--on:#04150c;--r:#ff6a5a;--in:rgba(255,255,255,.07)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 15px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif;min-height:100vh}
[hidden]{display:none!important}
.scr{position:relative;min-height:100vh;overflow:hidden;display:flex}
.mesh{position:absolute;inset:-20%;background:radial-gradient(40% 40% at 20% 20%,rgba(54,242,162,.35),transparent),radial-gradient(35% 35% at 85% 30%,rgba(255,90,74,.28),transparent),radial-gradient(45% 45% at 50% 95%,rgba(10,143,82,.35),transparent);filter:blur(30px);animation:dr 14s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(4%,-3%) scale(1.12)}}
@media(prefers-reduced-motion:reduce){.mesh{animation:none}}
.wc{position:relative;max-width:520px;margin:auto;padding:22px;width:100%;display:grid;gap:16px}
.top{display:flex;justify-content:space-between;align-items:center}
.lg{font-weight:700;font-size:21px;letter-spacing:-.3px}.lg b{color:var(--ac)}
h1{font-size:clamp(32px,9vw,46px);line-height:1.15;font-weight:700;letter-spacing:-1px}
.sub{color:var(--mu);font-size:16px}
.bento{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bento div{background:var(--s);border:1px solid var(--bd);border-radius:22px;padding:14px 10px;text-align:center;font-size:26px;backdrop-filter:blur(14px)}.bento b{display:block;font:600 12px 'IBM Plex Sans Arabic';margin-top:4px}
.gl{background:var(--s);border:1px solid var(--bd);border-radius:28px;padding:18px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);margin-bottom:12px}
.btn{width:100%;border:1px solid var(--bd);border-radius:18px;padding:14px;font:600 15px 'IBM Plex Sans Arabic',system-ui;cursor:pointer;color:var(--tx);background:var(--in)}
.pri{background:var(--ac);color:var(--on);border:0;box-shadow:0 10px 30px -10px var(--ac)}
.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:14px}
.ic{border:1px solid var(--bd);background:var(--s);color:var(--tx);border-radius:14px;min-height:38px;padding:0 12px;font:600 13px 'IBM Plex Sans Arabic',system-ui;cursor:pointer;backdrop-filter:blur(10px)}
.ln{background:none;border:0;color:var(--ac);font:600 14px 'IBM Plex Sans Arabic',system-ui;cursor:pointer;padding:8px}
input,select{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit}
select option{color:#000}
label{display:block;font-size:12px;color:var(--mu);margin:0 4px 4px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.er{color:var(--r);font-size:13px;min-height:20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:var(--s);border-bottom:1px solid var(--bd)}
.hd{max-width:720px;margin:auto;padding:8px 16px;display:flex;justify-content:space-between;align-items:center}.hb{display:flex;gap:6px}
main{max-width:720px;margin:auto;padding:16px 16px 120px}
.hero{padding:6px 4px 16px}.hero h2{font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.6px}.hero p{color:var(--mu)}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lvs button{border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:20px;padding:12px 4px;font:600 13px 'IBM Plex Sans Arabic',system-ui;cursor:pointer}.lvs button i{display:block;font-style:normal;font-size:24px}.lvs .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.al{border-color:var(--r);background:color-mix(in srgb,var(--r) 12%,transparent);color:var(--r);font-weight:600}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sum small{color:var(--mu);font-size:12px;display:block}.sum b{font-size:24px;font-weight:700;letter-spacing:-.5px}
.bar{height:8px;border-radius:9px;background:var(--in);margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);border-radius:9px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.dh b{font-size:17px}.wx{font-size:13px;background:var(--in);padding:4px 11px;border-radius:99px;white-space:nowrap}
.it{display:flex;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}.it>div{flex:1;min-width:0}.it small{display:block;color:var(--mu);font-size:12px}.it span{font-weight:600;font-size:13px;white-space:nowrap}
time{width:40px;font-size:12px;color:var(--mu);flex:none;text-align:center}
.th{width:48px;height:48px;border-radius:16px;background:var(--in);display:grid;place-items:center;font-size:22px;flex:none;font-style:normal;object-fit:cover}
em{color:var(--r);font-style:normal;font-size:12px;font-weight:600;margin-inline-start:6px}
.cr{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.ch{padding:7px 15px;border-radius:99px;border:1px solid var(--bd);background:var(--s);color:var(--tx);font:600 13px 'IBM Plex Sans Arabic',system-ui;white-space:nowrap;cursor:pointer}.ch.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:16px;right:16px;max-width:400px;margin:auto;display:flex;background:var(--s);border:1px solid var(--bd);border-radius:28px;padding:6px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:6;box-shadow:0 14px 40px -12px rgba(0,0,0,.4)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:8px 0;border-radius:22px;font:600 11px 'IBM Plex Sans Arabic',system-ui;cursor:pointer}nav button b{display:block;font-size:19px}nav .on{background:var(--ac);color:var(--on)}
#ts{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--in);color:var(--tx);border:1px solid var(--bd);box-shadow:var(--sh);padding:12px 20px;border-radius:20px;font-weight:600;z-index:10;max-width:90%;text-align:center}
</style>
<style>
:root{--bg:#f5ead2;--s:#fffaf0;--bd:rgba(120,85,30,.16);--tx:#2b1f0e;--mu:#7d6a4c;--ac:#a8702a;--on:#fff;--r:#d52b1e;--in:#eddfc2;--sh:0 10px 30px -16px rgba(110,70,10,.4)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1a140b;--s:#2a2113;--bd:rgba(255,235,190,.1);--tx:#f7ecd6;--mu:#b9a47f;--ac:#e0b66c;--on:#2a1c06;--r:#ff6a5a;--in:#35291a;--sh:0 10px 30px -16px #000}}
:root[data-theme=dark]{--bg:#1a140b;--s:#2a2113;--bd:rgba(255,235,190,.1);--tx:#f7ecd6;--mu:#b9a47f;--ac:#e0b66c;--on:#2a1c06;--r:#ff6a5a;--in:#35291a;--sh:0 10px 30px -16px #000}
.mesh{background:radial-gradient(40% 40% at 15% 15%,rgba(224,182,108,.5),transparent),radial-gradient(35% 35% at 90% 30%,rgba(240,214,160,.45),transparent),radial-gradient(45% 45% at 50% 100%,rgba(190,140,70,.35),transparent)}
.gl{box-shadow:var(--sh);backdrop-filter:none;-webkit-backdrop-filter:none;border-radius:24px}
.bento div{backdrop-filter:none;box-shadow:var(--sh);color:var(--ac)}.bento b{color:var(--tx)}
.bento .bi,.lvs i,nav b{display:grid;place-items:center}.lvs i{margin-bottom:4px}

function unpack(o){if(!WS.some(x=>x[0]===o.f.w))throw 0;const f={w:o.f.w,i:IN.includes(o.f.i)?o.f.i:'',l:[0,1,2].includes(+o.f.l)?+o.f.l:1,d:Math.max(1,Math.min(14,+o.f.d||1)),p:Math.max(1,Math.min(20,+o.f.p||1)),b:+o.f.b||0,dt:Date.now()};return{f,p:{hotel:o.h?fat(o.h):{price:0,en:'-',ar:'-'},rooms:+o.r||1,total:+o.t||0,days:o.d.slice(0,14).map(d=>({tm:IN.includes(d.m)?d.m:'culture',sq:d.s.map(([k,s,c])=>({k:K2[k]?k:'a',s:fat(s),c:+c||0}))}))}}}
const spLk=async()=>{const o=pack();return o?location.href.split(/[#?]/)[0]+'#p='+await enc(o):''};
function spPre(){const c=CUR;spLk().then(u=>{if(c)c.u=u}).catch(()=>{})}
const pbar=()=>`<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn sm" onclick="spSave()">${svg('bookmark',16)}${t('psv')}</button><button class="btn sm" onclick="spLink()">${svg('link',16)}${t('pln')}</button><button class="btn sm" onclick="spWa()">${svg('send',16)}${t('pwa')}</button><button class="btn sm" onclick="spPdf()">${svg('file',16)}${t('ppd')}</button></div>`;
async function spSave(){if(!ses){toast(t('psl'));return show('aut')}const o=pack();if(!o)return;const ti=wnm(o.f.w)+' · '+o.f.d+' '+t('day');
if(sb){const r=await sb.from('plans').insert({title:ti,data:o});if(!r.error)return toast(t('psd'));if(!/plans|relation|schema cache/i.test(r.error.message))return toast(r.error.message)}
const A=LS.g('at_pl_'+ses.id,[]);A.unshift({id:'l'+Date.now(),data:o,created_at:new Date().toISOString()});LS.s('at_pl_'+ses.id,A);toast(t('psl2'))}
async function spLink(){if(!CUR)return;const u=CUR.u||await spLk();if(navigator.share){try{await navigator.share({title:'AlgeTrip',url:u});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(u);toast(t('pcp'))}catch(e){prompt(t('pln'),u)}}
async function spWa(){if(!CUR)return;const u=CUR.u||await spLk(),{f,p}=CUR;open('https://wa.me/?text='+encodeURIComponent(`${t('pwt')} ${wnm(f.w)} — ${f.d} ${t('day')}\n${t('tot')}: ${fmt(p.total)}\n${u}`),'_blank')}
function spPdf(){if(!CUR)return;const{f,p}=CUR;let h=$('#pp');if(!h){h=document.createElement('div');h.id='pp';document.body.appendChild(h)}
h.innerHTML=`<h1>AlgeTrip — ${esc(wnm(f.w))}</h1><p>${f.d} ${t('day')} · ${f.p} ${t('ppl')} · ${t('tot')}: ${fmt(p.total)}</p>`+(p.hotel.id?`<h3>${t('lod')}</h3><p><b>${esc(nm(p.hotel))}</b> — ${fmt(p.hotel.price*p.rooms*f.d)}</p>`:'')+p.days.map((d,i)=>`<h3>${t('day')} ${i+1} · ${t(d.tm)}</h3>`+d.sq.map(x=>`<p>${t(K2[x.k])}: <b>${esc(nm(x.s))}</b> — ${fmt(x.c)}</p>`).join('')).join('');window.print()}
function openPlan(o){const{f,p}=unpack(o);$('#fw').value=f.w;$('#fs').value=f.i;$('#fd').value=f.d;$('#fp').value=f.p;$('#fb').value=f.b;lv=f.l;lvb();last={f,seed:0,snap:p};loadOsm(f.w);setTab('plan');showPlan();$('#res').scrollIntoView({behavior:'smooth'})}
async function openShared(z){try{openPlan(await dec(z));toast(t('pshd'))}catch(e){toast(t('pbad'))}}
async function mpl(){const V=$('#pl');if(!ses){V.innerHTML=`<div class="gl"><p style="margin-bottom:10px">${t('pnl')}</p><button class="btn pri" onclick="show('aut')">${t('signin')}</button></div>`;return}
let A=LS.g('at_pl_'+ses.id,[]).map(x=>({...x,loc:1}));if(sb){const r=await sb.from('plans').select('id,data,created_at').order('created_at',{ascending:false});if(!r.error)A=r.data.concat(A)}
PL=A;V.innerHTML=A.length?A.map((x,i)=>`<div class="gl" style="padding:12px"><b>${esc(wnm(x.data.f.w))} · ${x.data.f.d} ${t('day')}</b><small style="display:block;color:var(--mu)">${fmt(x.data.t)} · ${new Date(x.created_at).toLocaleDateString(lang==='ar'?'ar-u-nu-latn':'en-GB')}${x.loc?' · '+t('ploc'):''}</small><div style="display:flex;gap:8px;margin-top:10px"><button class="btn sm pri" onclick="plOpen(${i})">${t('pop')}</button><button class="btn sm ${pdl===x.id?'al':''}" onclick="plDel(${i})">${pdl===x.id?t('sure'):t('del')}</button></div></div>`).join(''):`<div class="gl" style="color:var(--mu)">${t('pe')}</div>`}
function plOpen(i){try{openPlan(PL[i].data)}catch(e){toast(t('pbad'))}}
async function plDel(i){const x=PL[i];if(pdl!==x.id){pdl=x.id;return mpl()}pdl=null;if(x.loc)LS.s('at_pl_'+ses.id,LS.g('at_pl_'+ses.id,[]).filter(y=>y.id!==x.id));else{const r=await sb.from('plans').delete().eq('id',x.id);if(r.error)return toast(r.error.message)}toast(t('gone'));mpl()}
/* ---- shell ---- */
const opts=(el,a)=>{if(!el)return;const v=el.value;el.innerHTML=a.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('');if(v)el.value=v};
function sels(){const W=WS.map(w=>[w[0],lang==='ar'?w[2]:w[1]]),S=IN.map(k=>[k,t(k)]);opts($('#fw'),W);opts($('#fs'),[['',t('any')]].concat(S));opts($('#sw'),W);opts($('#sg'),S);opts($('#sl'),[0,1,2].map(i=>[i,t('l'+i)]));opts($('#st'),['hotel','food','act','trans'].map(k=>[k,t('t'+k)]))}
function toast(m){const e=$('#ts');e.textContent=m;e.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>e.hidden=true,2400)}
function setTab(k){tab=k;['plan','explore','svc','plans'].forEach(x=>{$('#v-'+x).hidden=x!==k;document.querySelector(`nav [data-t=${x}]`).classList.toggle('on',x===k)});scrollTo(0,0);if(k==='explore')exp();if(k==='svc')svc();if(k==='plans')mpl()}
function show(id){['wel','aut','app'].forEach(x=>$('#'+x).hidden=x!==id);if(id==='aut')raf();ui();scrollTo(0,0)}
function ui(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i]').forEach(e=>e[e.dataset.i==='q1'?'innerHTML':'textContent']=t(e.dataset.i));document.querySelectorAll('.lb').forEach(e=>e.textContent=lang==='ar'?'EN':'عربي');$('#ba').textContent=ses?t('logout'):t('login');document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=e.dataset.ic==='fennec'?fen(+e.dataset.s):svg(e.dataset.ic,+e.dataset.s||22));sels();lvb();showPlan();$('#bh').textContent=tx('bmin');xbox();$('#dm').hidden=!!sb;$('#dm').textContent=tx('demo');if(!$('#aut').hidden)raf();setTab(tab)}
function tl(){lang=lang==='ar'?'en':'ar';LS.s('at_l',lang);ui()}
function tt(){const dk=th==='auto'?matchMedia('(prefers-color-scheme:dark)').matches:th==='dark';th=dk?'light':'dark';LS.s('at_t',th);document.documentElement.dataset.theme=th}
if(th!=='auto')document.documentElement.dataset.theme=th;
const mk=s=>s&&s.user&&s.user.email_confirmed_at?{e:s.user.email,id:s.user.id}:null;
(async()=>{if(sb){ses=mk((await sb.auth.getSession()).data.session);sb.auth.onAuthStateChange(async(ev,s)=>{if(['TOKEN_REFRESHED','USER_UPDATED','INITIAL_SESSION'].includes(ev))return;const n=mk(s);if(ev==='SIGNED_IN'&&n&&ses&&ses.id===n.id)return;ses=n;await load();show(ses?'app':'wel')})}
await load();show(ses||SHP?'app':'wel');if(SHP)openShared(SHP);
const er=new URLSearchParams(URLH.replace(/^[#?]/,'')).get('error_description');
if(er){show('aut');toast(er.replace(/\+/g,' '))}else if(/type=(signup|email)/.test(URLH)&&ses)toast(t('vf'));
if(URLH)history.replaceState(null,'',location.pathname)})();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
